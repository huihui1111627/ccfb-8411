version: 2

models:
  - name: dim_parts
    description: "部件维度与累计使用量"
    columns:
      - name: serial_number
        tests: [not_null, unique]
      - name: part_number
        tests: [not_null]
      - name: total_flight_hours
        tests:
          - expression_is_true:
              expression: "total_flight_hours >= 0"

  - name: fct_component_position_history
    description: "部件装机位置 SCD2 历史"
    columns:
      - name: serial_number
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: fct_component_history
    description: "部件履历事实表（装机区间粒度）"
    columns:
      - name: installation_id
        tests: [not_null, unique]
      - name: serial_number
        tests: [not_null]
      - name: aircraft_msn
        tests: [not_null]
      - name: interval_flight_hours
        tests:
          - expression_is_true:
              expression: "interval_flight_hours >= 0"

  - name: fct_life_limited_parts
    description: "时寿件剩余寿命与预警"
    columns:
      - name: serial_number
        tests: [not_null, unique]
      - name: life_status
        tests:
          - not_null
          - accepted_values: {values: ["HEALTHY", "WARNING", "EXPIRED"]}
      - name: remaining_hours
        tests: [not_null]

  - name: fct_ad_status
    description: "适航指令符合性状态"
    columns:
      - name: ad_id
        tests: [not_null]
      - name: aircraft_msn
        tests: [not_null]
      - name: compliance_status
        tests: [not_null]

  - name: fct_reliability_monthly
    description: "机/月可靠性指标"
    columns:
      - name: aircraft_msn
        tests: [not_null]
      - name: month_start
        tests: [not_null]
      - name: flight_hours
        tests:
          - expression_is_true:
              expression: "flight_hours >= 0"

  - name: fct_reliability_fleet_monthly
    description: "机队月汇总可靠性指标"
    columns:
      - name: month_start
        tests: [not_null, unique]
      - name: fleet_dispatch_rate_pct
        tests:
          - expression_is_true:
              expression: "fleet_dispatch_rate_pct between 0 and 100"
