[project]
name = "mro-dw"
version = "0.1.0"
description = "飞机维修数据仓库：dbt + DuckDB + Flask 控制台"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "flask>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mro-dw = "mro_dw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
